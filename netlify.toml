[build]
  publish = "."

# Keep the existing source layout while serving a clean public homepage URL.
[[redirects]]
  from = "/"
  to = "/html/index.html"
  status = 200

# Consolidate alternate homepage paths onto the public root URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/html"
  to = "/"
  status = 301

[[redirects]]
  from = "/html/"
  to = "/"
  status = 301

[[redirects]]
  from = "/html/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=86400"
